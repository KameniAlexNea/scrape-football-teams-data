[project]
name = "footy-scraper"
version = "0.1.0"
description = "Agentic football data scraper: squads, managers, league tables and match results per season, driven by claude-agent-sdk (Claude Code + in-process MCP tools) + Playwright."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.2.148",
    "loguru>=0.7.3",
]

[project.scripts]
footy-scrape = "footy_scraper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footy_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
